name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every Sunday and Wednesday (Every 3-4 days)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Allows manual testing

jobs:
  ping_database:
    runs-on: ubuntu-latest
    steps:
      - name: Send standard read request to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/team_members?status=eq.active&select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"